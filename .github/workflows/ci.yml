name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.14"
      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Provide python3 command on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/python-shim"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/python-shim/python3"
          chmod +x "$RUNNER_TEMP/python-shim/python3"
          printf '%s\n' "$RUNNER_TEMP/python-shim" >> "$GITHUB_PATH"
      - run: ./scripts/test

  claude-package:
    name: Validate Claude packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate with pinned official Claude CLI
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.269 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.269 plugin validate .claude-plugin/plugin.json --strict

  qt-text:
    name: Qt text rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python3 -m pip install --only-binary=:all: --require-hashes -r tests/qt-requirements.txt
      - run: python3 -m unittest discover -s tests -p test_qt_text_rendering.py -v
        env:
          OMARCHY_REQUIRE_QT: "1"
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software

  required:
    name: CI / Required
    if: always()
    needs: [test, workflow-lint, claude-package, qt-text]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix and workflow validation
        env:
          CLAUDE_RESULT: ${{ needs.claude-package.result }}
          MATRIX_RESULT: ${{ needs.test.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          QT_TEXT_RESULT: ${{ needs.qt-text.result }}
        run: |
          test "$CLAUDE_RESULT" = success
          test "$MATRIX_RESULT" = success
          test "$WORKFLOW_LINT_RESULT" = success
          test "$QT_TEXT_RESULT" = success
