name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.14"
      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Provide python3 command on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/python-shim"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/python-shim/python3"
          chmod +x "$RUNNER_TEMP/python-shim/python3"
          printf '%s\n' "$RUNNER_TEMP/python-shim" >> "$GITHUB_PATH"
      - run: ./scripts/test

  required:
    name: CI / Required
    if: always()
    needs: [test, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix and workflow validation
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$WORKFLOW_LINT_RESULT" = success
