name: Contract drift

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify pinned contracts and upstream heads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 scripts/check_contracts.py --online --check-heads
