name: Release draft
run-name: Draft ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag on main
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft:
    name: Verify and prepare draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Bind annotated tag to current remote main and successful CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          remote_tag="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          test "$commit" = "$remote_main"
          test "$remote_tag" = "$(git rev-parse "refs/tags/$TAG")"
          conclusions="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs" --jq '.check_runs[] | select(.name == "CI / Required") | .conclusion')"
          test "$(printf '%s\n' "$conclusions" | tail -n 1)" = success
          git checkout --detach "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Test and build twice
        env:
          TAG: ${{ inputs.tag }}
          DIST_A: ${{ runner.temp }}/release-dist-a
          DIST_B: ${{ runner.temp }}/release-dist-b
        run: |
          set -euo pipefail
          ./scripts/test
          python3 scripts/package_submission.py --output-dir "$DIST_A" --require-clean --git-tree "$TAG"
          python3 scripts/package_submission.py --output-dir "$DIST_B" --require-clean --git-tree "$TAG"
          diff -qr "$DIST_A" "$DIST_B"
          (cd "$DIST_A" && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-dist-a/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-dist-a/*
          if-no-files-found: error
      - name: Create or recover verified draft and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          DIST_A: ${{ runner.temp }}/release-dist-a
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file submission/release-notes.md
          fi
          gh release upload "$TAG" "$DIST_A"/* --clobber
          download="$(mktemp -d)"
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --dir "$download" --clobber; then
              break
            fi
            test "$attempt" -lt 5
            sleep "$((attempt * 2))"
          done
          diff -qr "$DIST_A" "$download"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          remote_tag="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          test "$COMMIT" = "$remote_main"
          test "$remote_tag" = "$(git rev-parse "refs/tags/$TAG")"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          printf 'Draft verified. This workflow never publishes releases.\n'
